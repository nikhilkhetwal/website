<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sompraz 52 - Premium Card Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #080c14 100%);
            min-height: 100vh;
            padding: 20px;
            color: #f1f5f9;
            /* Prevent horizontal scroll during animation */
            overflow-x: hidden; 
        }

        .container { max-width: 1400px; margin: 0 auto; position: relative; }

        h1 {
            text-align: center;
            font-size: clamp(1.2rem, 5vw, 2.5rem);
            font-weight: 900;
            background: linear-gradient(to bottom, #fff 20%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            opacity: 0;
            transition: 1s ease;
        }
        h1.visible { opacity: 1; }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            opacity: 0;
            transition: 1s ease 0.3s;
        }
        .subtitle.visible { opacity: 1; }

        /* --- START SCREEN --- */
        .start-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            background: #080c14;
            transition: opacity 0.6s ease;
        }
        .start-screen.hidden { opacity: 0; pointer-events: none; }

        .start-card {
            width: 220px;
            height: 308px;
            background: #1e293b url('back.png') center/cover;
            border-radius: 20px;
            cursor: pointer;
            border: 2px solid rgba(59, 130, 246, 0.4);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 20px;
        }
        .start-card:hover { transform: scale(1.05); border-color: #3b82f6; }

        /* --- CARD GRID --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(80px, 10vw, 110px), 1fr));
            gap: 12px;
            width: 100%;
            padding-bottom: 50px;
        }

        .card-container { 
            perspective: 1000px; 
            aspect-ratio: 2.5/3.5; 
            opacity: 0; 
            position: relative;
        }
        
        /* THE "THROW" ANIMATION */
        .card-container.dealing { 
            animation: dealFromVisibleBottom 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards; 
        }

        @keyframes dealFromVisibleBottom {
            0% { 
                opacity: 0; 
                transform: translate(var(--offset-x), var(--offset-y)) scale(0.3); 
            }
            30% {
                opacity: 1;
            }
            100% { 
                opacity: 1; 
                transform: translate(0, 0) scale(1); 
            }
        }

        .card {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card.spinning { animation: fastSpin 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fastSpin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(2160deg); } 
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card-back { background: #1e293b url('back.png') center/cover; }
        .card-front { transform: rotateY(180deg); background: white; }
        .card-face img { width: 100%; height: 100%; object-fit: contain; }

        /* --- MODAL --- */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center;
            z-index: 3000; backdrop-filter: blur(10px);
        }
        .modal.active { display: flex; }
        .modal-content { position: relative; }
        .modal-card {
            width: min(320px, 80vw); aspect-ratio: 2.5/3.5;
            background: white; border-radius: 20px; padding: 10px;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } }

        .close-btn {
            position: absolute; top: -60px; right: 0;
            background: white; border: none; width: 44px; height: 44px; border-radius: 50%;
            cursor: pointer; font-weight: bold; font-size: 1.2rem;
        }

        .qr-message {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #3b82f6; color: white; padding: 12px 24px; border-radius: 50px;
            font-weight: 700; z-index: 4000; opacity: 0;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .qr-message.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Celebration Styles */
        .confetti { position: fixed; z-index: 3500; pointer-events: none; }
        @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
</head>

<body>

    <div class="qr-message" id="qrMessage">🎉 Scan the QR Code to Get Your Article</div>

    <div class="start-screen" id="startScreen">
        <div class="start-card" id="startCard"></div>
        <div style="font-weight: 700; letter-spacing: 2px; color: white; margin-top: 10px;">TAP TO PLAY</div>
    </div>

    <div class="container">
        <h1 id="title">Play 52 Reasons to Win</h1>
        <p class="subtitle" id="subtitle">Sompraz Premium Edition</p>
        <div class="card-grid" id="cardGrid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">✕</button>
            <div class="modal-card">
                <img id="modalImage" src="" style="width:100%; height:100%; object-fit:contain;">
            </div>
        </div>
    </div>

    <script>
        const cardGrid = document.getElementById('cardGrid');
        const startScreen = document.getElementById('startScreen');
        const startCard = document.getElementById('startCard');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const modal = document.getElementById('modal');
        const closeBtn = document.getElementById('closeBtn');
        const modalImage = document.getElementById('modalImage');
        const qrMessage = document.getElementById('qrMessage');

        let cards = [];
        let confettiInterval = null;

        function createCards() {
            for (let i = 1; i <= 52; i++) {
                const container = document.createElement('div');
                container.className = 'card-container';
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="card-face card-back"></div>
                    <div class="card-face card-front">
                        <img src="f1.png" style="width:100%; height:100%; object-fit:contain;">
                    </div>
                `;

                container.appendChild(card);
                container.addEventListener('click', () => {
                    if (!card.classList.contains('flipped') && !card.classList.contains('spinning')) {
                        card.classList.add('spinning');
                        setTimeout(() => {
                            card.classList.remove('spinning');
                            card.classList.add('flipped');
                            setTimeout(() => {
                                modalImage.src = 'f1.png';
                                modal.classList.add('active');
                                startCelebration();
                            }, 300);
                        }, 1200);
                    }
                });
                cardGrid.appendChild(container);
                cards.push(container);
            }
        }

        function shuffleAndDeal() {
            // Viewport center bottom logic
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            const targetX = viewportWidth / 2;
            const targetY = viewportHeight + 100; // Start slightly off-screen below the visible area

            cards.forEach((card, idx) => {
                const rect = card.getBoundingClientRect();
                
                // Difference between visible bottom-center and card's visible grid position
                const offX = targetX - (rect.left + rect.width / 2);
                const offY = targetY - (rect.top + rect.height / 2);
                
                card.style.setProperty('--offset-x', offX + 'px');
                card.style.setProperty('--offset-y', offY + 'px');
                
                setTimeout(() => {
                    card.classList.add('dealing');
                }, idx * 50); // Stagger for smooth dealing
            });
        }

        function startCelebration() {
            qrMessage.classList.add('show');
            confettiInterval = setInterval(() => {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + '%';
                c.style.top = '-10px';
                c.style.background = ['#3b82f6', '#8b5cf6', '#ec4899'][Math.floor(Math.random()*3)];
                c.style.width = '10px'; c.style.height = '10px';
                c.style.animation = `confettiFall 3s linear forwards`;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }, 200);
        }

        startCard.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            setTimeout(() => {
                startScreen.style.display = 'none';
                title.classList.add('visible');
                subtitle.classList.add('visible');
                shuffleAndDeal();
            }, 600);
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
            clearInterval(confettiInterval);
            qrMessage.classList.remove('show');
            cards.forEach(c => c.querySelector('.card').classList.remove('flipped'));
        });

        createCards();
    </script>
</body>
</html>
