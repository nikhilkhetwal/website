<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sompraz 52 - Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #080c14 100%);
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
            color: #f1f5f9;
        }

        .container { max-width: 1400px; margin: 0 auto; position: relative; }

        /* --- TITLE & MINI CARDS --- */
        .title-wrap {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 5px; opacity: 0; transition: 1s ease;
        }
        .title-wrap.visible { opacity: 1; }

        h1 {
            font-size: clamp(1.1rem, 4.5vw, 2.5rem); font-weight: 900;
            background: linear-gradient(to bottom, #fff 20%, #3b82f6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .card-stack { position: relative; width: 75px; height: 60px; display: flex; align-items: center; }

        .mini-card {
            width: 40px; height: 56px; background: white; border-radius: 4px;
            position: absolute; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5); font-family: serif;
        }
        .card-five { z-index: 2; color: #d12d36; border: 1px solid #eee; left: 0; }
        .card-two { 
            z-index: 1; color: #1a1a1a; left: 28px; 
            transform: rotate(18deg); transform-origin: bottom center;
            animation: gentleSway 4s ease-in-out infinite; border: 1px solid #ddd;
        }
        .suit-mini { font-size: 0.6rem; position: absolute; top: 3px; left: 4px; }
        .number-main { font-size: 1.3rem; font-weight: bold; margin-top: 4px; }

        @keyframes gentleSway { 0%, 100% { transform: rotate(15deg); } 50% { transform: rotate(22deg); } }

        .subtitle {
            text-align: center; color: #94a3b8; margin-bottom: 20px;
            text-transform: uppercase; letter-spacing: 2px;
            font-size: clamp(0.6rem, 2vw, 0.8rem); opacity: 0; transition: 1s ease 0.3s;
        }
        .subtitle.visible { opacity: 1; }

        /* --- START SCREEN --- */
        .start-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 2000;
            background: #080c14; transition: opacity 0.6s ease;
        }
        .start-screen.hidden { opacity: 0; pointer-events: none; }
        .start-card {
            width: min(200px, 45vw); aspect-ratio: 2.5/3.5;
            background: url('back.png') center/cover; border-radius: 15px;
            cursor: pointer; border: 2px solid #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); margin-bottom: 20px;
        }

        /* --- CARD GRID --- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(clamp(70px, 9vw, 100px), 1fr));
            gap: 10px; width: 100%; padding-bottom: 80px;
        }

        /* LANDSCAPE OPTIMIZATION */
        @media (max-height: 500px) and (orientation: landscape) {
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
            .modal-card { width: 180px !important; }
            .close-btn { top: 10px !important; right: 10px !important; color: #000; background: #fff; }
        }

        .card-container { perspective: 1000px; aspect-ratio: 2.5/3.5; opacity: 0; }
        
        /* YOUR REQUESTED THROW ANIMATION */
        .card-container.dealing { 
            animation: dealFromVisibleBottom 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards; 
        }

        @keyframes dealFromVisibleBottom {
            0% { opacity: 0; transform: translate(var(--offset-x), var(--offset-y)) scale(0.3); }
            30% { opacity: 1; }
            100% { opacity: 1; transform: translate(0, 0) scale(1); }
        }

        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; }
        .card.spinning { animation: fastSpin 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fastSpin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(2160deg); } }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .card-back { background: url('back.png') center/cover; }
        .card-front { transform: rotateY(180deg); background: white; }
        .card-face img { width: 100%; height: 100%; object-fit: contain; }

        /* --- MODAL --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(10px); }
        .modal.active { display: flex; }
        .modal-card { width: min(300px, 85vw); aspect-ratio: 2.5/3.5; background: white; border-radius: 20px; padding: 10px; animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); position: relative; }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } }
        .close-btn { position: absolute; top: -50px; right: 0; background: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .qr-message {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #3b82f6; color: white; padding: 12px 24px; border-radius: 50px;
            font-weight: 700; z-index: 4000; transition: 0.5s; white-space: nowrap;
            font-size: clamp(10px, 3.5vw, 16px); opacity: 0;
        }
        .qr-message.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .confetti { position: fixed; z-index: 3500; pointer-events: none; }
        @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
        .firework { position: fixed; width: 4px; height: 4px; border-radius: 50%; z-index: 3500; pointer-events: none; }
        @keyframes fireworkExplode { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(var(--x), var(--y)); opacity: 0; } }
    </style>
</head>

<body>

    <div class="qr-message" id="qrMessage">🎉 Scan the QR Code to Get Your Article</div>

    <div class="start-screen" id="startScreen">
        <div class="start-card" id="startCard"></div>
        <div style="font-weight: 700; letter-spacing: 2px; color: white;">TAP TO PLAY</div>
    </div>

    <div class="container">
        <div class="title-wrap" id="titleWrap">
            <h1>Play</h1>
            <div class="card-stack">
                <div class="mini-card card-two">
                    <span class="suit-mini">♠</span>
                    <span class="number-main">2</span>
                </div>
                <div class="mini-card card-five">
                    <span class="suit-mini">♥</span>
                    <span class="number-main">5</span>
                </div>
            </div>
            <h1>Reasons to Win</h1>
        </div>
        <p class="subtitle" id="subtitle">Sompraz</p>
        <div class="card-grid" id="cardGrid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-card">
            <button class="close-btn" id="closeBtn">✕</button>
            <img id="modalImage" src="f1.png" style="width:100%; height:100%; object-fit:contain;">
        </div>
    </div>

    <script>
        const cardGrid = document.getElementById('cardGrid');
        const startScreen = document.getElementById('startScreen');
        const titleWrap = document.getElementById('titleWrap');
        const subtitle = document.getElementById('subtitle');
        const modal = document.getElementById('modal');
        const qrMessage = document.getElementById('qrMessage');
        
        let cards = [];
        let confettiInterval, fireworkInterval;
        const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#ef4444'];

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'flip') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            } else if(type === 'deal') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
            }
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function triggerHaptic() { if (navigator.vibrate) navigator.vibrate(15); }

        // --- CELEBRATION ---
        function createConfetti() {
            for (let i = 0; i < 12; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + '%';
                c.style.top = '-10px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.width = '8px'; c.style.height = '6px';
                c.style.animation = `confettiFall 3s linear forwards`;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 3000);
            }
        }

        function spawnFirework() {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * (window.innerHeight / 2);
            for (let i = 0; i < 20; i++) {
                const f = document.createElement('div');
                f.className = 'firework';
                f.style.left = x + 'px'; f.style.top = y + 'px';
                f.style.background = colors[Math.floor(Math.random() * colors.length)];
                const angle = (Math.PI * 2 * i) / 20;
                const velocity = Math.random() * 80 + 80;
                f.style.setProperty('--x', Math.cos(angle) * velocity + 'px');
                f.style.setProperty('--y', Math.sin(angle) * velocity + 'px');
                f.style.animation = `fireworkExplode 1s ease-out forwards`;
                document.body.appendChild(f);
                setTimeout(() => f.remove(), 1000);
            }
        }

        function createDoubleFireworks() {
            spawnFirework();
            spawnFirework();
        }

        // --- GAMEPLAY ---
        function createCards() {
            for (let i = 1; i <= 52; i++) {
                const container = document.createElement('div');
                container.className = 'card-container';
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-face card-back"></div><div class="card-face card-front"><img src="f1.png"></div>`;
                container.appendChild(card);
                
                container.onclick = () => {
                    if (!card.classList.contains('flipped') && !card.classList.contains('spinning')) {
                        triggerHaptic();
                        playSound('flip');
                        card.classList.add('spinning');
                        setTimeout(() => {
                            card.classList.remove('spinning');
                            card.classList.add('flipped');
                            setTimeout(() => {
                                modal.classList.add('active');
                                qrMessage.classList.add('show');
                                confettiInterval = setInterval(createConfetti, 500);
                                fireworkInterval = setInterval(createDoubleFireworks, 1000);
                            }, 300);
                        }, 1200);
                    }
                };
                cardGrid.appendChild(container);
                cards.push(container);
            }
        }

        function shuffleAndDeal() {
            const targetX = window.innerWidth / 2;
            const targetY = window.innerHeight + 100;

            cards.forEach((card, idx) => {
                const rect = card.getBoundingClientRect();
                const offX = targetX - (rect.left + rect.width / 2);
                const offY = targetY - (rect.top + rect.height / 2);
                
                card.style.setProperty('--offset-x', offX + 'px');
                card.style.setProperty('--offset-y', offY + 'px');
                
                setTimeout(() => {
                    playSound('deal');
                    card.classList.add('dealing');
                }, idx * 60); 
            });
        }

        document.getElementById('startCard').onclick = () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            startScreen.classList.add('hidden');
            setTimeout(() => {
                startScreen.style.display = 'none';
                titleWrap.classList.add('visible');
                subtitle.classList.add('visible');
                shuffleAndDeal();
            }, 600);
        };

        document.getElementById('closeBtn').onclick = () => {
            modal.classList.remove('active');
            qrMessage.classList.remove('show');
            clearInterval(confettiInterval);
            clearInterval(fireworkInterval);
            cards.forEach(c => c.querySelector('.card').classList.remove('flipped'));
        };

        createCards();
    </script>
</body>
</html>
